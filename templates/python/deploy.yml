# Copy to .github/workflows/deploy.yml and replace placeholders.
name: Deploy
on: { push: { branches: [main] } }
permissions: { contents: read, packages: write }
jobs:
  pipeline:
    uses: YOUR_GITHUB_USERNAME/velryn-platform/.github/workflows/docker-deploy-vps.yml@v1
    with:
      app_name: CHANGE_ME
      image_name: CHANGE_ME-api
      deploy_path: /opt/CHANGE_ME
      healthcheck_url: http://localhost:8000/health
      migration_command: docker compose --env-file .env --env-file deployment/current.env run --rm api python manage.py migrate
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
