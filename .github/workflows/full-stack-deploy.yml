name: Reusable Full-Stack Deployment

on:
  workflow_call:
    inputs:
      app_name: { required: true, type: string }
      web_image_name: { required: true, type: string }
      web_dockerfile: { type: string, default: ./apps/web/Dockerfile }
      web_context: { type: string, default: ./apps/web }
      api_image_name: { required: true, type: string }
      api_dockerfile: { type: string, default: ./apps/api/Dockerfile }
      api_context: { type: string, default: ./apps/api }
      worker_image_name: { type: string, default: '' }
      worker_dockerfile: { type: string, default: ./apps/api/Dockerfile }
      worker_context: { type: string, default: ./apps/api }
      image_tag: { type: string, default: '' }
      tag_latest: { type: boolean, default: false }
      deploy_path: { required: true, type: string }
      compose_file: { type: string, default: docker-compose.yml }
      environment: { type: string, default: production }
      healthcheck_url: { type: string, default: '' }
      healthcheck_timeout: { type: number, default: 120 }
      migration_command: { type: string, default: '' }
      pre_deploy_command: { type: string, default: '' }
      post_deploy_command: { type: string, default: '' }
    secrets:
      VPS_HOST: { required: true }
      VPS_USER: { required: true }
      VPS_SSH_KEY: { required: true }
      VPS_KNOWN_HOSTS: { required: true }
      VPS_PORT: { required: false }
    outputs:
      image_tag:
        value: ${{ jobs.web.outputs.image_tag }}
      web_image_digest:
        value: ${{ jobs.web.outputs.image_digest }}
      api_image_digest:
        value: ${{ jobs.api.outputs.image_digest }}
      deployment_status:
        value: ${{ jobs.deploy.outputs.deployment_status }}

permissions:
  contents: read
  packages: write

jobs:
  web:
    uses: rapper015/velryn-platform/.github/workflows/docker-build.yml@v1
    with:
      image_name: ${{ inputs.web_image_name }}
      dockerfile: ${{ inputs.web_dockerfile }}
      docker_context: ${{ inputs.web_context }}
      image_tag: ${{ inputs.image_tag }}
      tag_latest: ${{ inputs.tag_latest }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    uses: rapper015/velryn-platform/.github/workflows/docker-build.yml@v1
    with:
      image_name: ${{ inputs.api_image_name }}
      dockerfile: ${{ inputs.api_dockerfile }}
      docker_context: ${{ inputs.api_context }}
      image_tag: ${{ inputs.image_tag }}
      tag_latest: ${{ inputs.tag_latest }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  worker:
    if: inputs.worker_image_name != ''
    uses: rapper015/velryn-platform/.github/workflows/docker-build.yml@v1
    with:
      image_name: ${{ inputs.worker_image_name }}
      dockerfile: ${{ inputs.worker_dockerfile }}
      docker_context: ${{ inputs.worker_context }}
      image_tag: ${{ inputs.image_tag }}
      tag_latest: ${{ inputs.tag_latest }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [web, api, worker]
    if: ${{ always() && needs.web.result == 'success' && needs.api.result == 'success' && (needs.worker.result == 'success' || needs.worker.result == 'skipped') }}
    uses: rapper015/velryn-platform/.github/workflows/deploy-vps.yml@v1
    with:
      app_name: ${{ inputs.app_name }}
      deploy_path: ${{ inputs.deploy_path }}
      compose_file: ${{ inputs.compose_file }}
      environment: ${{ inputs.environment }}
      image_tag: ${{ needs.web.outputs.image_tag }}
      image_env_vars: WEB_IMAGE_TAG,API_IMAGE_TAG,WORKER_IMAGE_TAG
      healthcheck_url: ${{ inputs.healthcheck_url }}
      healthcheck_timeout: ${{ inputs.healthcheck_timeout }}
      migration_command: ${{ inputs.migration_command }}
      pre_deploy_command: ${{ inputs.pre_deploy_command }}
      post_deploy_command: ${{ inputs.post_deploy_command }}
      commit_sha: ${{ github.sha }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
