name: Express CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: YOUR_GITHUB_USERNAME/velryn-platform/.github/workflows/ci-node.yml@v1
    with:
      node_version: '22'
      package_manager: npm

  deploy:
    if: github.event_name == 'push'
    needs: ci
    uses: YOUR_GITHUB_USERNAME/velryn-platform/.github/workflows/docker-deploy-vps.yml@v1
    with:
      app_name: example-api
      image_name: example-api
      deploy_path: /opt/velryn/example-api
      healthcheck_url: http://localhost:3000/health
      migration_command: npm run migrate
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
