name: MERN CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  frontend-ci:
    uses: YOUR_GITHUB_USERNAME/velryn-platform/.github/workflows/ci-nextjs.yml@v1
    with:
      working_directory: frontend

  backend-ci:
    uses: YOUR_GITHUB_USERNAME/velryn-platform/.github/workflows/ci-node.yml@v1
    with:
      working_directory: backend

  deploy:
    if: github.event_name == 'push'
    needs: [frontend-ci, backend-ci]
    uses: YOUR_GITHUB_USERNAME/velryn-platform/.github/workflows/full-stack-deploy.yml@v1
    with:
      app_name: mern-saas
      web_image_name: mern-saas-web
      web_dockerfile: ./frontend/Dockerfile
      web_context: ./frontend
      api_image_name: mern-saas-api
      api_dockerfile: ./backend/Dockerfile
      api_context: ./backend
      deploy_path: /opt/mern-saas
      healthcheck_url: http://localhost:3001/health
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
